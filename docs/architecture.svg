<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a07" />
      <stop offset="50%" stop-color="#19120c" />
      <stop offset="100%" stop-color="#0a0705" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ffd06a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241a12" />
      <stop offset="100%" stop-color="#18110b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="640" rx="16" fill="url(#bgGrad)" stroke="#3e2e21" stroke-width="2" />

  <!-- Top Banner / Header -->
  <g transform="translate(40, 35)">
    <circle cx="20" cy="20" r="18" fill="#ffd06a" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2" filter="url(#glow)" />
    <text x="20" y="26" font-family="'Cinzel', serif, Georgia" font-size="16" fill="#ffd06a" text-anchor="middle">🕯️</text>
    <text x="50" y="18" font-family="'Cinzel', serif, Georgia" font-size="20" font-weight="bold" fill="#fff5e8" letter-spacing="1">MEMORIA VIVA — SYSTEM ARCHITECTURE</text>
    <text x="50" y="34" font-family="sans-serif" font-size="12" fill="#d9cec4">Ghost in the Machine · Local Heritage Séance &amp; Sovereign Data Ofrenda</text>
  </g>

  <!-- Left: Client Layer -->
  <g transform="translate(50, 110)">
    <rect width="250" height="490" rx="12" fill="url(#cardGrad)" stroke="#533c2a" stroke-width="1.5" />
    <rect width="250" height="40" rx="12" fill="#302116" />
    <text x="125" y="25" font-family="'Cinzel', serif, Georgia" font-size="14" font-weight="bold" fill="#ffd06a" text-anchor="middle">FRONTEND CLIENT</text>
    <text x="125" y="60" font-family="sans-serif" font-size="11" fill="#a89a8e" text-anchor="middle">Next.js 14 · Tailwind CSS · React</text>

    <!-- Component 1: Séance Chat -->
    <g transform="translate(20, 80)">
      <rect width="210" height="85" rx="8" fill="#1b120c" stroke="#f59e0b" stroke-width="1.2" />
      <text x="15" y="24" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#fff5e8">🔮 Spirit Channeler</text>
      <text x="15" y="42" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Real-time séance queries</text>
      <text x="15" y="58" font-family="sans-serif" font-size="10" fill="#c8bbb1">• In-chat soul nodes [Mother/Daughter]</text>
      <text x="15" y="74" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Creativity temperature dial (0.1–1.0)</text>
    </g>

    <!-- Component 2: Family Tree -->
    <g transform="translate(20, 185)">
      <rect width="210" height="110" rx="8" fill="#1b120c" stroke="#f59e0b" stroke-width="1.2" />
      <text x="15" y="24" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#fff5e8">🌳 Family Tree &amp; Ofrenda</text>
      <text x="15" y="42" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Round profile image nodes</text>
      <text x="15" y="58" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Bracketed roles: [Grandmother]</text>
      <text x="15" y="74" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Top Row → Daughters → Granddaughters</text>
      <text x="15" y="90" font-family="sans-serif" font-size="10" fill="#c8bbb1">• View Switcher: Tree | Gallery | Both</text>
    </g>

    <!-- Component 3: Timeline Tab -->
    <g transform="translate(20, 315)">
      <rect width="210" height="85" rx="8" fill="#1b120c" stroke="#f59e0b" stroke-width="1.2" />
      <text x="15" y="24" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#fff5e8">⚡ Timeline Analytics</text>
      <text x="15" y="42" font-family="sans-serif" font-size="10" fill="#c8bbb1">• CSV Historical upload</text>
      <text x="15" y="58" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Temporal pattern detection</text>
      <text x="15" y="74" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Reliability score dashboard</text>
    </g>

    <!-- Client note -->
    <g transform="translate(20, 420)">
      <rect width="210" height="50" rx="6" fill="#2a1e15" stroke="#3e2e21" />
      <text x="105" y="22" font-family="sans-serif" font-size="10" fill="#ffd06a" text-anchor="middle">🎨 Dia de los Muertos Aesthetic</text>
      <text x="105" y="38" font-family="sans-serif" font-size="9" fill="#a89a8e" text-anchor="middle">Cempasúchil Gold · Glowing Wax Candles</text>
    </g>
  </g>

  <!-- Connectors Client -> Backend -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 300 200 L 360 200" marker-end="url(#arrow)" />
    <path d="M 300 350 L 360 350" />
    <path d="M 300 480 L 360 480" />
  </g>

  <!-- Middle: FastAPI Backend Engine -->
  <g transform="translate(360, 110)">
    <rect width="260" height="490" rx="12" fill="url(#cardGrad)" stroke="#533c2a" stroke-width="1.5" />
    <rect width="260" height="40" rx="12" fill="#302116" />
    <text x="130" y="25" font-family="'Cinzel', serif, Georgia" font-size="14" font-weight="bold" fill="#ffd06a" text-anchor="middle">FASTAPI BACKEND</text>
    <text x="130" y="60" font-family="sans-serif" font-size="11" fill="#a89a8e" text-anchor="middle">Python 3.11 · REST API · Uvicorn</text>

    <!-- Endpoint 1 -->
    <g transform="translate(20, 80)">
      <rect width="220" height="85" rx="8" fill="#17100a" stroke="#ffd06a" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#ffd06a">POST /api/v1/spirit/channel</text>
      <text x="15" y="42" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Cascade Waterfall Orchestrator</text>
      <text x="15" y="58" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Injects dynamic family context</text>
      <text x="15" y="74" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Preserves Día de los Muertos voice</text>
    </g>

    <!-- Endpoint 2 -->
    <g transform="translate(20, 185)">
      <rect width="220" height="95" rx="8" fill="#17100a" stroke="#ffd06a" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#ffd06a">POST /spirit/family-tree/upload</text>
      <text x="15" y="42" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Multi-generational parser</text>
      <text x="15" y="58" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Auto-maps Ancestor, Daughter,</text>
      <text x="15" y="74" font-family="sans-serif" font-size="10" fill="#c8bbb1">  Granddaughter generations</text>
      <text x="15" y="90" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Memory store synchronization</text>
    </g>

    <!-- Endpoint 3 -->
    <g transform="translate(20, 300)">
      <rect width="220" height="85" rx="8" fill="#17100a" stroke="#ffd06a" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#ffd06a">POST /timeline/analyze</text>
      <text x="15" y="42" font-family="sans-serif" font-size="10" fill="#c8bbb1">• TabPFN in-context training</text>
      <text x="15" y="58" font-family="sans-serif" font-size="10" fill="#c8bbb1">• Historical target verification</text>
      <text x="15" y="74" font-family="sans-serif" font-size="10" fill="#c8bbb1">• NaN-immune data handling</text>
    </g>

    <!-- Data Store -->
    <g transform="translate(20, 405)">
      <rect width="220" height="65" rx="8" fill="#251910" stroke="#f59e0b" stroke-width="1.2" />
      <text x="15" y="22" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#ffd06a">💾 Sovereign Data Vault</text>
      <text x="15" y="40" font-family="sans-serif" font-size="10" fill="#c8bbb1">• timeline.csv · ancestral_timeline.csv</text>
      <text x="15" y="56" font-family="sans-serif" font-size="10" fill="#c8bbb1">• 100% offline local storage</text>
    </g>
  </g>

  <!-- Connectors Backend -> AI Layer -->
  <g stroke="#ffd06a" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 620 180 L 680 180" />
    <path d="M 620 280 L 680 280" />
    <path d="M 620 380 L 680 380" />
    <path d="M 620 480 L 680 480" />
  </g>

  <!-- Right: Multi-Tier AI Inference & ML Layer -->
  <g transform="translate(680, 110)">
    <rect width="270" height="490" rx="12" fill="url(#cardGrad)" stroke="#533c2a" stroke-width="1.5" />
    <rect width="270" height="40" rx="12" fill="#302116" />
    <text x="135" y="25" font-family="'Cinzel', serif, Georgia" font-size="13" font-weight="bold" fill="#ffd06a" text-anchor="middle">INTELLIGENCE RUNTIME</text>
    <text x="135" y="60" font-family="sans-serif" font-size="11" fill="#a89a8e" text-anchor="middle">Local Open Weights · Cloud · ML</text>

    <!-- Tier 1: Local Ollama -->
    <g transform="translate(20, 80)">
      <rect width="230" height="85" rx="8" fill="#131b12" stroke="#10b981" stroke-width="1.5" />
      <text x="15" y="22" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#34d399">TIER 1 · LOCAL OLLAMA</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#a7f3d0">Model: gemma3:1b / llama-3.3</text>
      <text x="15" y="56" font-family="sans-serif" font-size="10" fill="#d1fae5">✓ Zero cloud latency or telemetry</text>
      <text x="15" y="72" font-family="sans-serif" font-size="10" fill="#d1fae5">✓ 100% Private local inference</text>
    </g>

    <!-- Tier 2: Groq Fallback -->
    <g transform="translate(20, 180)">
      <rect width="230" height="85" rx="8" fill="#1c160e" stroke="#f59e0b" stroke-width="1.5" />
      <text x="15" y="22" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fbbf24">TIER 2 · GROQ API FALLBACK</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#fde68a">Model: llama-3.3-70b-versatile</text>
      <text x="15" y="56" font-family="sans-serif" font-size="10" fill="#fef3c7">✓ Ultra-fast LPU inference (500 t/s)</text>
      <text x="15" y="72" font-family="sans-serif" font-size="10" fill="#fef3c7">✓ Seamless failover on Ollama offline</text>
    </g>

    <!-- Tier 3: Offline Poetic Engine -->
    <g transform="translate(20, 280)">
      <rect width="230" height="85" rx="8" fill="#1f1412" stroke="#ef4444" stroke-width="1.5" />
      <text x="15" y="22" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#f87171">TIER 3 · OFFLINE POETIC ENGINE</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#fecaca">Zero-dependency embedded</text>
      <text x="15" y="56" font-family="sans-serif" font-size="10" fill="#fee2e2">✓ Sacred Día de los Muertos verses</text>
      <text x="15" y="72" font-family="sans-serif" font-size="10" fill="#fee2e2">✓ Never goes silent — cloud proof</text>
    </g>

    <!-- Machine Learning: TabPFN -->
    <g transform="translate(20, 380)">
      <rect width="230" height="85" rx="8" fill="#161524" stroke="#818cf8" stroke-width="1.5" />
      <text x="15" y="22" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#a5b4fc">TABPFN CLASSIFIER (ML)</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#c7d2fe">In-Context Prior Transformer</text>
      <text x="15" y="56" font-family="sans-serif" font-size="10" fill="#e0e7ff">✓ Instant small-sample learning</text>
      <text x="15" y="72" font-family="sans-serif" font-size="10" fill="#e0e7ff">✓ Historical pattern reliability score</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c08" />
      <stop offset="100%" stop-color="#1c130c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="480" rx="12" fill="url(#bg)" stroke="#4a3524" stroke-width="2" />

  <!-- Title -->
  <text x="450" y="45" font-family="'Cinzel', serif, Georgia" font-size="20" font-weight="bold" fill="#ffd06a" text-anchor="middle" letter-spacing="1">
    🕯️ SPIRIT CHANNELER · TRIPLE-TIER WATERFALL CASCADE
  </text>
  <text x="450" y="70" font-family="sans-serif" font-size="12" fill="#a89a8e" text-anchor="middle">
    Autonomous Failover Protocol Ensuring Zero Downtime for Ancestral Memory
  </text>

  <!-- Step 0: User Prompt -->
  <g transform="translate(60, 110)">
    <rect width="180" height="80" rx="8" fill="#251810" stroke="#f59e0b" stroke-width="1.5" />
    <text x="90" y="32" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#fff5e8" text-anchor="middle">Séance Query</text>
    <text x="90" y="52" font-family="sans-serif" font-size="10" fill="#ffd06a" text-anchor="middle">User Whispers Prompt</text>
    <text x="90" y="68" font-family="sans-serif" font-size="9" fill="#a89a8e" text-anchor="middle">+ Temperature Dial</text>
  </g>

  <!-- Arrow to Tier 1 -->
  <path d="M 240 150 L 300 150" stroke="#ffd06a" stroke-width="2" fill="none" />
  <polygon points="300,150 292,145 292,155" fill="#ffd06a" />

  <!-- Tier 1: Local Ollama -->
  <g transform="translate(310, 100)">
    <rect width="250" height="100" rx="8" fill="#132117" stroke="#10b981" stroke-width="2" />
    <text x="125" y="28" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">PRIORITY 1: LOCAL OLLAMA</text>
    <text x="125" y="48" font-family="monospace" font-size="11" fill="#a7f3d0" text-anchor="middle">gemma3:1b / llama-3.3</text>
    <text x="125" y="68" font-family="sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Endpoint: localhost:11434 (5s timeout)</text>
    <text x="125" y="85" font-family="sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">🔒 100% Private · Zero Network Dependency</text>
  </g>

  <!-- Green Success Arrow to User Response -->
  <path d="M 560 135 L 700 135" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,2" />
  <polygon points="700,135 692,130 692,140" fill="#10b981" />
  <text x="630" y="125" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Success</text>

  <!-- Failure Arrow down to Tier 2 -->
  <path d="M 435 200 L 435 240" stroke="#f87171" stroke-width="2" fill="none" />
  <polygon points="435,240 430,232 440,232" fill="#f87171" />
  <text x="495" y="224" font-family="sans-serif" font-size="9" fill="#fca5a5">If Offline / Error</text>

  <!-- Tier 2: Groq API Fallback -->
  <g transform="translate(310, 240)">
    <rect width="250" height="100" rx="8" fill="#261c10" stroke="#f59e0b" stroke-width="2" />
    <text x="125" y="28" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">PRIORITY 2: GROQ CLOUD API</text>
    <text x="125" y="48" font-family="monospace" font-size="11" fill="#fde68a" text-anchor="middle">llama-3.3-70b-versatile</text>
    <text x="125" y="68" font-family="sans-serif" font-size="10" fill="#fef3c7" text-anchor="middle">Endpoint: api.groq.com/openai/v1</text>
    <text x="125" y="85" font-family="sans-serif" font-size="9" fill="#fcd34d" text-anchor="middle">⚡ Ultra-fast LPU inference (500 tokens/sec)</text>
  </g>

  <!-- Gold Success Arrow to User Response -->
  <path d="M 560 290 L 700 210" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="4,2" />
  <polygon points="700,210 690,212 696,220" fill="#f59e0b" />
  <text x="630" y="260" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Failover Success</text>

  <!-- Failure Arrow down to Tier 3 -->
  <path d="M 435 340 L 435 375" stroke="#f87171" stroke-width="2" fill="none" />
  <polygon points="435,375 430,367 440,367" fill="#f87171" />
  <text x="495" y="360" font-family="sans-serif" font-size="9" fill="#fca5a5">If No Internet / Offline</text>

  <!-- Tier 3: Poetic Engine -->
  <g transform="translate(310, 375)">
    <rect width="250" height="85" rx="8" fill="#2b1515" stroke="#ef4444" stroke-width="2" />
    <text x="125" y="25" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">PRIORITY 3: OFFLINE OFRENDA</text>
    <text x="125" y="44" font-family="monospace" font-size="10" fill="#fecaca" text-anchor="middle">Embedded Poetic Memory Keepers</text>
    <text x="125" y="62" font-family="sans-serif" font-size="9" fill="#fee2e2" text-anchor="middle">Zero dependencies · Contextual Día verses</text>
    <text x="125" y="76" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">🍂 Never goes dark, even with zero cloud or GPU</text>
  </g>

  <!-- Red Arrow to User Response -->
  <path d="M 560 417 L 700 240" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4,2" />
  <polygon points="700,240 690,245 698,252" fill="#ef4444" />

  <!-- Final User Response Card -->
  <g transform="translate(700, 160)">
    <rect width="160" height="110" rx="8" fill="#1b120c" stroke="#ffd06a" stroke-width="2" filter="url(#glow)" />
    <text x="80" y="30" font-family="'Cinzel', serif" font-size="13" font-weight="bold" fill="#ffd06a" text-anchor="middle">Séance Reply</text>
    <text x="80" y="52" font-family="sans-serif" font-size="10" fill="#fff5e8" text-anchor="middle">Poetic Response</text>
    <text x="80" y="70" font-family="sans-serif" font-size="9" fill="#d9cec4" text-anchor="middle">+ Round Soul Nodes</text>
    <text x="80" y="86" font-family="sans-serif" font-size="9" fill="#d9cec4" text-anchor="middle">+ Bracketed Roles</text>
    <text x="80" y="100" font-family="monospace" font-size="8" fill="#a89a8e" text-anchor="middle">Model &amp; Token Meta</text>
  </g>
</svg>

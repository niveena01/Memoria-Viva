    <!-- Node 1: Valentina Cruz -->
    <g transform="translate(130, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#fbbf24" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">👧</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Valentina Cruz</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Granddaughter]</text>
    </g>

    <!-- Node 2: Camila Rivas -->
    <g transform="translate(360, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#fbbf24" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">👧‍🦱</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Camila Rivas</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Granddaughter]</text>
    </g>

    <!-- Node 3: Ximena Morales -->
    <g transform="translate(590, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#fbbf24" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">🧒</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Ximena Morales</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Granddaughter]</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="460" y="520" font-family="sans-serif" font-size="11" fill="#c8bbb1" text-anchor="middle">
    All portrait nodes are interactive · Click to whisper any ancestral soul in the local Spirit Séance
  </text>
</svg>

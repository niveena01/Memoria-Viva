<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d09" />
      <stop offset="100%" stop-color="#1e140d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="920" height="540" rx="14" fill="url(#bg)" stroke="#4e3725" stroke-width="2" />

  <!-- Header -->
  <text x="460" y="42" font-family="'Cinzel', serif, Georgia" font-size="20" font-weight="bold" fill="#ffd06a" text-anchor="middle" letter-spacing="1">
    🌳 HIERARCHICAL FAMILY TREE &amp; LIVING OFRENDA
  </text>
  <text x="460" y="66" font-family="sans-serif" font-size="12" fill="#a89a8e" text-anchor="middle">
    Multi-Generational Heritage · Round Profile Image Nodes · Bracketed Relationship Roles
  </text>

  <!-- ROW 1: TOP ROW (ANCESTORS & ELDERS) -->
  <g transform="translate(60, 90)">
    <rect width="800" height="100" rx="10" fill="#22170f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="25" y="24" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#ffd06a">TOP ROW · ANCESTORS &amp; PARENTS (GENERATION I)</text>

    <!-- Node 1: Abuela Rosa -->
    <g transform="translate(70, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#ffd06a" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">👵</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Abuela Rosa</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Grandmother]</text>
    </g>

    <!-- Node 2: Abuelo Miguel -->
    <g transform="translate(240, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#ffd06a" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">👴</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Abuelo Miguel</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Grandfather]</text>
    </g>

    <!-- Node 3: Mateo Morales -->
    <g transform="translate(410, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#ffd06a" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">🧔</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Mateo Morales</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Great-Grandfather]</text>
    </g>

    <!-- Node 4: Elena Morales -->
    <g transform="translate(580, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#ffd06a" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">🧓</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Elena Morales</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Great-Grandmother]</text>
    </g>
  </g>

  <!-- Connectors: Row 1 to Row 2 -->
  <g stroke="#f59e0b" stroke-width="2" fill="none">
    <path d="M 460 190 L 460 215" />
    <path d="M 230 215 L 690 215" />
    <circle cx="460" cy="215" r="4" fill="#ffd06a" />
    <path d="M 230 215 L 230 240" />
    <path d="M 460 215 L 460 240" />
    <path d="M 690 215 L 690 240" />
  </g>

  <!-- ROW 2: MIDDLE ROW (DAUGHTERS & MOTHERS) -->
  <g transform="translate(60, 240)">
    <rect width="800" height="100" rx="10" fill="#22170f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="25" y="24" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#ffd06a">NEXT ROW DOWN · DAUGHTERS &amp; MOTHERS (GENERATION II &amp; III)</text>

    <!-- Node 1: Carmen Silva -->
    <g transform="translate(130, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#f59e0b" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">👩</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Carmen Silva</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Mother]</text>
    </g>

    <!-- Node 2: Sofia Rivas -->
    <g transform="translate(360, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#f59e0b" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">👱‍♀️</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Sofia Rivas</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Daughter]</text>
    </g>

    <!-- Node 3: Lucia Morales -->
    <g transform="translate(590, 32)">
      <circle cx="28" cy="28" r="24" fill="#301f14" stroke="#f59e0b" stroke-width="2" filter="url(#glow)" />
      <text x="28" y="34" font-size="20" text-anchor="middle">👩‍🦰</text>
      <text x="28" y="66" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fff5e8" text-anchor="middle">Lucia Morales</text>
      <text x="28" y="79" font-family="monospace" font-size="9" fill="#ffd06a" text-anchor="middle">[Daughter]</text>
    </g>
  </g>

  <!-- Connectors: Row 2 to Row 3 -->
  <g stroke="#f59e0b" stroke-width="2" fill="none">
    <path d="M 460 340 L 460 365" />
    <path d="M 230 365 L 690 365" />
    <circle cx="460" cy="365" r="4" fill="#ffd06a" />
    <path d="M 230 365 L 230 390" />
    <path d="M 460 365 L 460 390" />
    <path d="M 690 365 L 690 390" />
